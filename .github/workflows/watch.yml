name: Watch prices and coupon feeds
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/watch.yml'
permissions:
  contents: read
concurrency:
  group: indirim-avcisi-state
  cancel-in-progress: false
jobs:
  watch:
    # A disabled scheduled tracker should not consume a runner or report a failure.
    # Manual dispatch still runs preflight and reports missing prerequisites.
    if: github.event_name == 'workflow_dispatch' || vars.TRACKING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check production prerequisites (no secrets printed)
        env:
          TRACKING_ENABLED: ${{ vars.TRACKING_ENABLED }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.preflight
      - name: Install Neon driver
        run: pip install -r requirements.txt
      - name: Run live price and coupon checks
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m tracker run
