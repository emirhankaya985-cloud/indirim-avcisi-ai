name: Public marketplace smoke (diagnostic)
on:
  push:
    paths:
      - '.github/workflows/public-smoke.yml'
      - 'scripts/smoke_marketplaces.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-diagnostic-\${{ github.ref }}
  cancel-in-progress: false
jobs:
  marketplace-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run public marketplace diagnostic (never updates watchlist)
        id: probe
        continue-on-error: true
        run: python -m scripts.smoke_marketplaces
      - name: Store full public price observations and run ID
        if: always()
        run: cat reports/live-marketplace-smoke.json
      - name: Archive diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-price-smoke
          path: reports/live-marketplace-smoke.json
          retention-days: 7
      - name: Require at least 3 successful price reads
        if: steps.probe.outcome == 'failure'
        run: exit 1
