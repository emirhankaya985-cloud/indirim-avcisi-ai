name: Open Prices source probe
on:
  pull_request:
    paths:
      - 'scripts/probe_open_prices.py'
      - '.github/workflows/open-prices-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.probe_open_prices
