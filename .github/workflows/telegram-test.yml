name: Telegram connection test
on:
  push:
    paths: ['.github/workflows/telegram-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Telegram API acceptance test (real send)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m tracker test-telegram
